<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGOS PS4 JAILBREAK</title>

    <style>
        :root {
            --bg-color: #0f111a;
            --accent: #00d2ff;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.1) 0%, transparent 50%),
                linear-gradient(to bottom, var(--bg-color), #090a0f);
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.5s ease;
            background: transparent;
            border: none;
            outline: none;
        }

        #start-screen img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            border: 3px solid rgba(0, 210, 255, 0.6);
            object-fit: cover;
            display: block;
        }

        #start-screen b {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 0.15em;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        #start-screen p {
            color: #94a3b8;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        #main-frame {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        #main-frame.active-frame {
            pointer-events: auto;
        }

        /* رسالة تشخيص مؤقتة؛ احذفها بعد التأكد من الصوت */
        #audio-status {
            position: fixed;
            left: 12px;
            bottom: 12px;
            z-index: 10001;
            max-width: 85%;
            padding: 8px 12px;
            color: #fff;
            background: rgba(0, 0, 0, 0.82);
            border: 1px solid rgba(0, 210, 255, 0.55);
            border-radius: 6px;
            font: 14px Arial, sans-serif;
        }
    </style>
</head>
<body>

    <button id="start-screen" type="button" onclick="initSite()">
        <img src="Dragos.png" alt="DRAGOS LOGO">
        <b>DRAGOS</b>
        <p>TAP OR PRESS 'X' TO ENTER</p>
    </button>

    <div id="audio-status">جارٍ تجهيز الصوت…</div>

    <iframe id="main-frame" src=""></iframe>

    <script>
        var startScreen = document.getElementById("start-screen");
        var mainFrame = document.getElementById("main-frame");
        var audioStatus = document.getElementById("audio-status");

        var audioContext = null;
        var songBuffer = null;
        var musicSource = null;
        var playRequested = false;
        var contextUnlocked = false;
        var hasStarted = false;
        var homeLoaded = false;

        function setAudioStatus(message) {
            audioStatus.innerHTML = message;
        }

        function startMusic() {
            if (!playRequested || !contextUnlocked || !songBuffer || !audioContext || musicSource) {
                return;
            }

            try {
                musicSource = audioContext.createBufferSource();
                musicSource.buffer = songBuffer;
                musicSource.loop = true;
                musicSource.connect(audioContext.destination);
                musicSource.start(0);
                setAudioStatus("تم إرسال أمر تشغيل الصوت.");
            } catch (e) {
                musicSource = null;
                setAudioStatus("تعذّر بدء الصوت في متصفح السوني.");
            }
        }

        function unlockAudioFromClick() {
            if (!audioContext) {
                return;
            }

            try {
                if (audioContext.resume) {
                    var resumeResult = audioContext.resume();

                    if (resumeResult && typeof resumeResult.then === "function") {
                        resumeResult.then(function () {
                            contextUnlocked = true;
                            startMusic();
                        }, function () {
                            setAudioStatus("المتصفح رفض تفعيل الصوت بعد الضغط.");
                        });
                    } else {
                        contextUnlocked = true;
                        startMusic();
                    }
                } else {
                    contextUnlocked = true;
                    startMusic();
                }
            } catch (e) {
                setAudioStatus("تعذّر تفعيل الصوت في المتصفح.");
            }
        }

        function loadSong() {
            var AudioContextClass = window.AudioContext || window.webkitAudioContext;

            if (!AudioContextClass) {
                setAudioStatus("هذا المتصفح لا يوفّر Web Audio API.");
                return;
            }

            try {
                audioContext = new AudioContextClass();
                contextUnlocked = (audioContext.state === "running");
            } catch (e) {
                setAudioStatus("تعذّر إنشاء AudioContext.");
                return;
            }

            setAudioStatus("جارٍ تحميل song.mp3…");

            var request = new XMLHttpRequest();
            request.open("GET", "./song.mp3", true);
            request.responseType = "arraybuffer";

            request.onload = function () {
                if (request.status < 200 || request.status >= 300) {
                    setAudioStatus("فشل تحميل song.mp3. رمز الحالة: " + request.status);
                    return;
                }

                try {
                    audioContext.decodeAudioData(
                        request.response,
                        function (decodedBuffer) {
                            songBuffer = decodedBuffer;
                            setAudioStatus("الصوت جاهز؛ اضغط X للبدء.");
                            startMusic();
                        },
                        function () {
                            setAudioStatus("متصفح السوني لم يستطع فك ترميز ملف MP3.");
                        }
                    );
                } catch (e) {
                    setAudioStatus("حدث خطأ أثناء فك ترميز ملف MP3.");
                }
            };

            request.onerror = function () {
                setAudioStatus("فشل الاتصال بملف song.mp3.");
            };

            request.send();
        }

        function loadHome() {
            if (homeLoaded) {
                return;
            }

            homeLoaded = true;
            mainFrame.src = "home.html";
            mainFrame.style.opacity = "1";
            mainFrame.classList.add("active-frame");

            try {
                mainFrame.focus();
            } catch (e) {
                // تجاهل إن لم يدعم المتصفح التركيز على الإطار
            }
        }

        function initSite() {
            if (hasStarted) {
                return;
            }

            hasStarted = true;
            playRequested = true;

            startScreen.style.opacity = "0";
            mainFrame.style.opacity = "1";
            mainFrame.classList.add("active-frame");

            setTimeout(function () {
                startScreen.style.display = "none";
            }, 500);

            /* استئناف الصوت مباشرة من ضغطة المستخدم */
            unlockAudioFromClick();

            /* لا نعلّق تحميل الصفحة بانتظار الصوت */
            setTimeout(loadHome, 3000);
        }

        /* حمّل وفك ترميز MP3 قبل ضغط X */
        loadSong();
    </script>
</body>
</html>
