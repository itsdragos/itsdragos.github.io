<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGOS PS4 JAILBREAK</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --accent: #00d2ff;
        }

        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100%; 
            overflow: hidden; 
            background-color: var(--bg-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            
            /* تم نقل نفس خلفية موقعك الأصلي هنا ليكون الانتقال سلساً */
            background-image: 
              radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.1) 0%, transparent 50%),
              linear-gradient(to bottom, var(--bg-color), #090a0f);
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }
        
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        /* قياسات وتصميم الصورة مطابقة تماماً لطلبك */
        #start-screen img { 
            width: 220px; 
            height: 220px; 
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            border: 3px solid rgba(0, 210, 255, 0.6);
            object-fit: cover;
            display: block;
        }

        /* تصميم النص مطابق لطلبك */
        #start-screen b { 
            font-size: 36px; 
            font-weight: 800; 
            letter-spacing: 0.15em;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* نص النقر للدخول مع حركة خفيفة */
        #start-screen p { 
            color: #94a3b8; 
            margin-top: 15px; 
            font-size: 16px; 
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        #main-frame { 
            width: 100%; 
            height: 100%; 
            border: none; 
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none; /* يمنع متصفح السوني من التفاعل مع الإطار قبل الدخول */
        }
        
        .active-frame {
            pointer-events: auto !important;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <img src="Dragos.png" alt="DRAGOS LOGO" />
        <b>DRAGOS</b>
        <p>TAP OR PRESS 'X' TO ENTER</p>
    </div>

    <!-- إضافة preload لتجهيز الأغنية في ذاكرة الـ PS4 -->
    <audio id="bg-music" loop playsinline preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <iframe id="main-frame" src="home.html"></iframe>

    <script>
        const startScreen = document.getElementById('start-screen');
        const mainFrame = document.getElementById('main-frame');
        const bgMusic = document.getElementById('bg-music');
        let hasStarted = false;

        function initSite() {
            if (hasStarted) return; // يمنع الكود من العمل مرتين عند الضغط المتكرر
            hasStarted = true;

            // تم استبدال الكود الحديث بكود كلاسيكي لتجنب مشاكل متصفح PS4
            try {
                bgMusic.play();
            } catch (e) {
                // حتى لو فشل الصوت، سيدخلك للموقع ولن يعلق
            }

            startScreen.style.opacity = '0';
            mainFrame.style.opacity = '1';
            mainFrame.classList.add('active-frame');
            
            setTimeout(function() {
                startScreen.style.display = 'none';
                mainFrame.focus();
            }, 500);
        }

        // تسجيل جميع أنواع الضغطات (لمس، ماوس، وأزرار يد السوني) لتأكيد الاستجابة
        document.addEventListener('click', initSite);
        document.addEventListener('mousedown', initSite);
        document.addEventListener('touchstart', initSite);
        document.addEventListener('keydown', initSite);
    </script>

</body>
</html>
