<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRAGOS PS4 JAILBREAK</title>
<style>
  :root {
    --bg-color: #0f111a;
    --card-bg: #1a1d2d;
    --accent: #00d2ff;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --success: #10b981;
    --warning: #f59e0b;
    --error: #ef4444;
  }

  * { box-sizing: border-box; }

  html, body { 
    margin: 0; 
    padding: 0; 
    background-color: var(--bg-color); 
    color: var(--text-main);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.1) 0%, transparent 50%),
      linear-gradient(to bottom, var(--bg-color), #090a0f);
  }

  #brand { 
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 25px 10px;
    background: transparent; /* إزالة أي خلفية قد تسبب خطوط مستطيلة */
    border-bottom: none;     /* إزالة الخط الفاصل السفلي القديم */
  }
  
  #brand img { 
    width: 220px; 
    height: 220px; 
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
    border: 3px solid rgba(0, 210, 255, 0.6);
    object-fit: cover;
    display: block;          /* يمنع أي فراغات تحت الصورة */
  }
  
  #brand b { 
    font-size: 36px; 
    font-weight: 800; 
    letter-spacing: 0.15em;
    background: linear-gradient(90deg, #fff, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
  }


  /* Main Container */
  #wrap { 
    background: var(--card-bg);
    padding: 40px; 
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    width: 90%;
    max-width: 500px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.05);
    animation: fadeInUp 0.8s ease-out;
  }

  /* Status Text */
  #state { 
    font-size: 24px; 
    font-weight: 700; 
    margin: 0 0 15px; 
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: color 0.3s;
  }

  /* Firmware Details */
  #det { 
    font-size: 16px; 
    color: var(--text-muted); 
    margin: 0 0 25px; 
    padding-bottom: 25px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  
  #det b { 
    color: var(--text-main); 
    font-weight: 600; 
    background: rgba(255,255,255,0.1);
    padding: 3px 8px;
    border-radius: 6px;
    margin: 0 4px;
  }

  /* Cache Status */
  #cache { 
    font-size: 14px; 
    color: var(--text-muted); 
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: rgba(0,0,0,0.2);
    border-radius: 20px;
  }
  
  /* Status Colors */
  #cache.cacheok { color: var(--success); background: rgba(16, 185, 129, 0.1);}
  .ok { color: var(--success); } 
  .bad { color: var(--error); } 
  .warn { color: var(--warning); }

  /* Animations */
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Loading Spinner effect for state */
  #state:after {
    content: '';
    display: inline-block;
    animation: dots 1.5s infinite steps(4);
  }
  @keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }
</style>
</head>
<body>

<div id="brand">
  <!-- يمكنك تغيير رابط الصورة هنا بصورة اللوجو الخاص بك إذا أردت -->
    <img src="Dragos.png" alt="DRAGOS LOGO">

  <b>DRAGOS</b>
</div>

<div id="wrap">
  <div id="state">Detecting Firmware</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "Firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>Supported</b>"
                     : " &middot; Not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("Loading Jailbreak", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("Offline - Loading from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("System Cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("Update Downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("Checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("Caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("Caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("Cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("Update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("Cached - Offline Ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("Cache Unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("Cache Obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
