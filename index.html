<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGOS PS4 JAILBREAK</title>

    <style>
        :root {
            --bg-color: #0f111a;
            --accent: #00d2ff;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;

            background-image:
                radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.1) 0%, transparent 50%),
                linear-gradient(to bottom, var(--bg-color), #090a0f);
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.5s ease;
            background: transparent;
            border: none;
            outline: none;
        }

        #start-screen img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            border: 3px solid rgba(0, 210, 255, 0.6);
            object-fit: cover;
            display: block;
        }

        #start-screen b {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 0.15em;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        #start-screen p {
            color: #94a3b8;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        #main-frame {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        #main-frame.active-frame {
            pointer-events: auto;
        }

        /*
          فيديو صغير وشفاف بدل audio؛
          اتركه ظاهرًا مؤقتًا مع controls أثناء الاختبار إذا احتجت.
        */
        #bg-music {
            position: fixed;
            left: 0;
            top: 0;
            width: 2px;
            height: 2px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <button id="start-screen" type="button" onclick="initSite()">
        <img src="Dragos.png" alt="DRAGOS LOGO">
        <b>DRAGOS</b>
        <p>TAP OR PRESS 'X' TO ENTER</p>
    </button>

    <!--
      ارفع song.mp4 في نفس مجلد هذا الملف.
      يجب أن يكون MP4 بفيديو H.264 وصوت AAC-LC.
    -->
    <video
        id="bg-music"
        loop
        preload="auto"
        playsinline
        webkit-playsinline
    >
        <source src="./song.mp4" type="video/mp4">
    </video>

    <iframe id="main-frame" src=""></iframe>

    <script>
        var startScreen = document.getElementById("start-screen");
        var mainFrame = document.getElementById("main-frame");
        var bgMusic = document.getElementById("bg-music");

        var hasStarted = false;
        var homeLoaded = false;

        function loadHome() {
            if (homeLoaded) return;

            homeLoaded = true;
            mainFrame.src = "home.html";
            mainFrame.style.opacity = "1";
            mainFrame.classList.add("active-frame");

            try {
                mainFrame.focus();
            } catch (e) {
                // تجاهل إذا لم يدعم المتصفح focus للإطار
            }
        }

        function initSite() {
            if (hasStarted) return;
            hasStarted = true;

            startScreen.style.opacity = "0";
            mainFrame.style.opacity = "1";
            mainFrame.classList.add("active-frame");

            setTimeout(function () {
                startScreen.style.display = "none";
            }, 500);

            /*
              إذا بدأ الفيديو، ننتظر ثانيتين ثم نفتح home.html.
              إذا فشل التشغيل، نفتح home.html على أي حال.
            */
            bgMusic.onplaying = function () {
                setTimeout(loadHome, 2000);
            };

            bgMusic.onerror = function () {
                loadHome();
            };

            try {
                var playResult = bgMusic.play();

                if (playResult && typeof playResult.catch === "function") {
                    playResult.catch(function () {
                        loadHome();
                    });
                }
            } catch (e) {
                loadHome();
            }

            // احتياط حتى لا تبقى الصفحة عالقة إذا لم يرسل المتصفح حدث التشغيل
            setTimeout(loadHome, 5000);
        }
    </script>

</body>
</html>
