<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DRAGOS PS4 JAILBREAK</title>
    <style>
      :root {
        --bg-color: #0f111a;
        --card-bg: #1a1d2d;
        --accent: #00d2ff;
        --text-main: #e2e8f0;
        --text-muted: #94a3b8;
        --success: #10b981;
        --warning: #f59e0b;
        --error: #ef4444;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-image: 
          radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.1) 0%, transparent 50%),
          linear-gradient(to bottom, var(--bg-color), #090a0f);
      }

      /* Header Branding */
      #brand { 
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        padding: 20px;
        width: 100%;
        animation: fadeInDown 0.8s ease-out;
      }
      
      #brand img { 
        width: 50px; 
        height: 50px; 
        border-radius: 50%;
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        border: 2px solid rgba(0, 210, 255, 0.5);
      }
      
      #brand b { 
        font-size: 26px; 
        font-weight: 800; 
        letter-spacing: 0.1em;
        background: linear-gradient(90deg, #fff, var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
      }

      /* Loading Spinner */
      #spin {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 60px;
        height: 60px;
        margin: -30px 0 0 -30px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* System Messages */
      #msg {
        position: fixed;
        top: 60%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--error);
        text-transform: uppercase;
        display: none;
        text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
      }

      #wrap { width: 100%; max-width: 800px; padding: 0 20px; }
      #state, #out { display: none; }

      /* JS States */
      body.done #spin { display: none; }
      body.fail #spin { display: none; }
      body.fail #msg { display: block; animation: fadeInDown 0.5s; }

      /* Detailed Log Mode (?log=1) */
      body.log { justify-content: flex-start; }
      body.log #brand { margin-bottom: 10px; }
      body.log #spin, body.log #msg { display: none; }
      
      body.log #state {
        display: block;
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 15px;
        text-transform: uppercase;
        color: var(--accent);
        text-align: center;
      }
      
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.5;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(0, 210, 255, 0.2);
        border-radius: 12px;
        padding: 20px;
        height: calc(100vh - 180px);
        overflow-y: auto;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      }

      /* Log Colors */
      .ok { color: var(--success); }
      .bad { color: var(--error); }
      .warn { color: var(--warning); }
      .safe { color: var(--success); }
      .danger { color: var(--error); }
      code { color: var(--accent); background: rgba(0, 210, 255, 0.1); padding: 2px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="brand">
      <img src="Dragos.png" alt="DRAGOS LOGO" />
      <b>DRAGOS</b>
    </div>
    
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
